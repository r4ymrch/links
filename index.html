<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>r4ymrch | link in bio</title>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <div id="overlay"></div>
    <div class="card-container fade-in">
      <div class="card-pfp spinning">
        <img src="assets/img/pfp.avif" alt="profile-picture">
      </div>
      <div class="card-summary">
        <h1 class="card-username">r4ymrch</h1>
        <p class="card-desc">Tech Enthusiast, Software Engineer, and student at <a href="https://unj.ac.id" target="_blank" rel="noopener">Universitas Negeri Jakarta</a></p>
      </div>
      <div class="card-shortcuts">
        <button type="button" id="gh-btn"></button>
        <button class="inactive" type="button" id="li-btn">󰌻</button>
        <button type="button" id="ig-btn">󰋾</button>
        <button type="button" id="x-btn"></button>
        <button class="inactive" type="button" id="fb-btn"></button>
      </div>
      <div class="card-buttons">
        <button type="button" id="gh-repo-lbtn">
          <p class="button-icon"></p>
          <p>See all my projects</p>
        </button>
        <p class="separator">--- Contact Me ---</p>
        <button class="inactive" type="button" id="wa-lbtn">
          <p class="button-icon">󰖣</p>
          <p>WhatsApp</p>
        </button>
        <button class="inactive" type="button" id="email-lbtn">
          <p class="button-icon"></p>
          <p>E-Mail</p>
        </button>
        <button class="inactive" type="button" id="li-lbtn">
          <p class="button-icon">󰌻</p>
          <p>LinkedIn</p>
        </button>
        <p class="separator">--- My Social Media ---</p>
        <button type="button" id="ig-lbtn">
          <p class="button-icon">󰋾</p>
          <p>Instagram [@radityo.h]</p>
        </button>
        <button type="button" id="x-lbtn">
          <p class="button-icon"></p>
          <p>X [@r4ymrch14]</p>
        </button>
        <button class="inactive" type="button" id="fb-lbtn">
          <p class="button-icon"></p>
          <p>Facebook [Ray March]</p>
        </button>
        <button class="inactive" type="button" id="dc-lbtn">
          <p class="button-icon"></p>
          <p>Discord [r4ymrch_]</p>
        </button>
      </div>
      <div class="card-footer">
        <p>  2026 r4ymrch. All rights reserved.</p>
        <p class="credit">Made with ❤️ by <a href="https://github.com/r4ymrch" target="_blank" rel="noopener">r4ymrch</a></p>
      </div>
    </div>
    <script src="index.js" type="text/javascript" charset="utf-8"></script>
  </body>
</html>
